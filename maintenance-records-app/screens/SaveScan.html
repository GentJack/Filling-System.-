<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Save scan</title>
</head>
<body style="margin:0;background:#fff">
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,select{font-family:inherit}
a{text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Lato', system-ui, sans-serif; color: #0B0B50; display: flex; flex-direction: column; padding: 24px 20px 24px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="Camera.html" aria-label="Back to scanner" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0B0B50">
      <svg aria-hidden="true" width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 32px; font-weight: 300">Save scan</h1>
  </div>
  <div style="display: flex; gap: 14px; margin-top: 12px">
    <div style="width: 106px; height: 142px; box-sizing: border-box; border: 1.5px solid #E3E4F0; background: #F2F3FB; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px" role="img" aria-label="Scanned page 1">
      <div style="width: 50%; height: 7px; border-radius: 4px; background: #C9C9E0"></div>
      <div style="width: 100%; height: 5px; border-radius: 3px; background: #DEDEEE"></div>
      <div style="width: 80%; height: 5px; border-radius: 3px; background: #DEDEEE"></div>
      <div style="width: 95%; height: 5px; border-radius: 3px; background: #DEDEEE"></div>
      <div style="width: 60%; height: 5px; border-radius: 3px; background: #DEDEEE"></div>
    </div>
    <div style="width: 106px; height: 142px; box-sizing: border-box; border: 1.5px solid #E3E4F0; background: #F2F3FB; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 8px" role="img" aria-label="Scanned page 2">
      <div style="width: 50%; height: 7px; border-radius: 4px; background: #C9C9E0"></div>
      <div style="width: 100%; height: 5px; border-radius: 3px; background: #DEDEEE"></div>
      <div style="width: 80%; height: 5px; border-radius: 3px; background: #DEDEEE"></div>
      <div style="width: 95%; height: 5px; border-radius: 3px; background: #DEDEEE"></div>
      <div style="width: 60%; height: 5px; border-radius: 3px; background: #DEDEEE"></div>
    </div>
    <a href="Camera.html" style="width: 106px; height: 142px; box-sizing: border-box; border: 2px dashed #1A66E8; border-radius: 14px; display: flex; align-items: center; justify-content: center; text-align: center; color: #1A66E8; font-size: 17px; font-weight: 700; line-height: 1.25">+ Add<br>page</a>
  </div>
  <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="name" style="font-weight: 700; font-size: 16px">Name</label>
      <input id="name" type="text" value="Task card 1043" style="width: 100%; height: 52px; box-sizing: border-box; border: 1.5px solid #E3E4F0; background: #F2F3FB; border-radius: 26px; padding: 0 20px; font-size: 17px; color: #0B0B50">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="aircraft" style="font-weight: 700; font-size: 16px">Aircraft</label>
      <div style="position: relative">
        <sc-raw-select id="aircraft" style="width: 100%; height: 52px; box-sizing: border-box; border: 1.5px solid #E3E4F0; background: #F2F3FB; border-radius: 26px; padding: 0 48px 0 20px; font-size: 17px; color: #4B4B66; appearance: none; -webkit-appearance: none"><option>Select registration…</option><option>ZS-XXX</option></sc-raw-select>
        <svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0B0B50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 20px; top: 16px; pointer-events: none"><path d="m6 9 6 6 6-6"></path></svg>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="folder" style="font-weight: 700; font-size: 16px">Folder</label>
      <div style="position: relative">
        <sc-raw-select id="folder" style="width: 100%; height: 52px; box-sizing: border-box; border: 1.5px solid #E3E4F0; background: #F2F3FB; border-radius: 26px; padding: 0 48px 0 20px; font-size: 17px; color: #0B0B50; appearance: none; -webkit-appearance: none"><option>Task cards</option><option>Technical logs</option><option>Releases (CRS)</option></sc-raw-select>
        <svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0B0B50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 20px; top: 16px; pointer-events: none"><path d="m6 9 6 6 6-6"></path></svg>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="wo" style="font-weight: 700; font-size: 16px">Work order</label>
      <input id="wo" type="text" placeholder="Enter number" style="width: 100%; height: 52px; box-sizing: border-box; border: 1.5px solid #E3E4F0; background: #F2F3FB; border-radius: 26px; padding: 0 20px; font-size: 17px; color: #0B0B50">
    </div>
  </div>
  <a href="SaveSuccess.html" style="margin-top: 26px; height: 58px; border-radius: 29px; background: #0B0B50; color: #FFFFFF; font-size: 20px; display: flex; align-items: center; justify-content: center">Save to Task cards</a>
</div>
</x-dc>



</body></html>
