<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Upload</title>
</head>
<body style="margin:0;background:#fff">
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,select{font-family:inherit}
a{text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Lato', system-ui, sans-serif; color: #0B0B50; display: flex; flex-direction: column; padding: 24px 20px 24px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="Home.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0B0B50">
      <svg aria-hidden="true" width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 32px; font-weight: 300">Upload</h1>
  </div>
  <div style="margin-top: 14px; display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: 1.5px solid #E3E4F0; border-radius: 22px; background: #F2F3FB">
    <span style="width: 48px; height: 48px; border-radius: 14px; background: #E9E9F6; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">PDF</span>
    <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 700">Task_card_1044.pdf</span><span style="font-size: 15px; color: #4B4B66">2.1 MB · 3 pages</span></span>
    <button aria-label="Remove file" style="width: 44px; height: 44px; background: none; border: 0; color: #0B0B50; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </button>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 12px">
    <button style="height: 48px; border-radius: 24px; background: #FFFFFF; color: #0B0B50; border: 2px solid #0B0B50; font-size: 17px; cursor: pointer">Choose another</button>
    <a href="Camera.html" style="height: 48px; box-sizing: border-box; border-radius: 24px; background: #FFFFFF; color: #0B0B50; border: 2px solid #0B0B50; font-size: 17px; display: flex; align-items: center; justify-content: center">Scan instead</a>
  </div>
  <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="name" style="font-weight: 700; font-size: 16px">Name</label>
      <input id="name" type="text" value="Task card 1044" style="width: 100%; height: 52px; box-sizing: border-box; border: 1.5px solid #E3E4F0; background: #F2F3FB; border-radius: 26px; padding: 0 20px; font-size: 17px; color: #0B0B50">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="aircraft" style="font-weight: 700; font-size: 16px">Aircraft</label>
      <div style="position: relative">
        <sc-raw-select id="aircraft" style="width: 100%; height: 52px; box-sizing: border-box; border: 1.5px solid #E3E4F0; background: #F2F3FB; border-radius: 26px; padding: 0 48px 0 20px; font-size: 17px; color: #0B0B50; appearance: none; -webkit-appearance: none"><option>ZS-XXX</option><option>Select registration…</option></sc-raw-select>
        <svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0B0B50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 20px; top: 16px; pointer-events: none"><path d="m6 9 6 6 6-6"></path></svg>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="folder" style="font-weight: 700; font-size: 16px">Folder</label>
      <div style="position: relative">
        <sc-raw-select id="folder" style="width: 100%; height: 52px; box-sizing: border-box; border: 1.5px solid #E3E4F0; background: #F2F3FB; border-radius: 26px; padding: 0 48px 0 20px; font-size: 17px; color: #0B0B50; appearance: none; -webkit-appearance: none"><option>Task cards</option><option>Technical logs</option></sc-raw-select>
        <svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0B0B50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; right: 20px; top: 16px; pointer-events: none"><path d="m6 9 6 6 6-6"></path></svg>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="wo" style="font-weight: 700; font-size: 16px">Work order</label>
      <input id="wo" type="text" value="48211" style="width: 100%; height: 52px; box-sizing: border-box; border: 1.5px solid #E3E4F0; background: #F2F3FB; border-radius: 26px; padding: 0 20px; font-size: 17px; color: #0B0B50">
    </div>
  </div>
  <a href="ReplaceConfirm.html" style="margin-top: 22px; height: 58px; border-radius: 29px; background: #0B0B50; color: #FFFFFF; font-size: 20px; display: flex; align-items: center; justify-content: center">Upload to Task cards</a>
  <p style="margin: 12px 0 0; font-size: 14px; color: #4B4B66; text-align: center">PDF or photo. If this replaces an existing document, it becomes the new revision.</p>
</div>
</x-dc>



</body></html>
