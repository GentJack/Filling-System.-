<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Sign in</title>
</head>
<body style="margin:0;background:#fff">
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,select{font-family:inherit}
a{text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Lato', system-ui, sans-serif; color: #0B0B50; display: flex; flex-direction: column; align-items: center; padding: 96px 28px 28px; overflow: hidden">
  <div role="img" aria-label="Logo placeholder" style="width: 168px; height: 48px; border: 1.5px dashed #9A9AB4; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #4B4B66; font-size: 13px; font-weight: 700; letter-spacing: 0.08em">YOUR LOGO</div>
  <h1 style="margin: 56px 0 0; font-size: 34px; font-weight: 300; line-height: 1.15; text-align: center">Maintenance Records</h1>
  <p style="margin: 10px 0 0; font-size: 17px; color: #4B4B66">Sign in with your work email</p>
  <div style="width: 100%; margin-top: 40px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="email" style="font-weight: 700; font-size: 15px">Work email</label>
      <input id="email" type="email" placeholder="name@yourairline.com" style="width: 100%; height: 52px; box-sizing: border-box; border: 1.5px solid #E3E4F0; background: #F2F3FB; border-radius: 26px; padding: 0 20px; font-size: 17px; color: #0B0B50">
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="password" style="font-weight: 700; font-size: 15px">Password</label>
      <input id="password" type="password" value="password1" style="width: 100%; height: 52px; box-sizing: border-box; border: 1.5px solid #E3E4F0; background: #F2F3FB; border-radius: 26px; padding: 0 20px; font-size: 17px; color: #0B0B50">
    </div>
  </div>
  <a href="LoginCode.html" style="width: 100%; height: 56px; box-sizing: border-box; margin-top: 32px; border-radius: 28px; background: #0B0B50; color: #FFFFFF; font-size: 20px; display: flex; align-items: center; justify-content: center">Sign in</a>
  <a href="Forgot.html" style="margin-top: 18px; min-height: 44px; display: flex; align-items: center; color: #1A66E8; font-weight: 700; font-size: 17px">Forgot password?</a>
  <p style="margin: auto 0 0; font-size: 14px; color: #4B4B66; text-align: center">Authorised staff only. Your activity is recorded.</p>
</div>
</x-dc>



</body></html>
