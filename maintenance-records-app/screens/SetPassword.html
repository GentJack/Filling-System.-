<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Set new password</title>
<link rel="stylesheet" href="app.css">
</head>
<body style="margin:0;background:#fff">
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="scr" style="width:390px;height:844px">
  <div class="logo">YOUR LOGO</div>
  <h1 class="t big" style="margin-top:40px">Set a new password</h1>
  <p class="sub m8">For te***@yourairline.com</p>
  <label class="lbl" for="p1">New password</label>
  <div class="inp focus" id="p1">•••••••••••<span class="sp"></span><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></div>
  <div class="prog m8" style="height:8px"><i style="width:75%"></i></div>
  <p class="msg">Strong. At least 12 characters.</p>
  <label class="lbl" for="p2">Confirm new password</label>
  <div class="inp" id="p2">•••••••••••</div>
  <div class="card m20">
    <div class="row" style="padding:10px 18px"><svg class="i s" style="color:var(--green)" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg><span>12 or more characters</span></div>
    <div class="row" style="padding:10px 18px"><svg class="i s" style="color:var(--green)" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg><span>Upper and lower case</span></div>
    <div class="row" style="padding:10px 18px"><svg class="i s" style="color:var(--green)" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg><span>A number</span></div>
  </div>
  <a class="btn m20" href="PasswordUpdated.html">Save password</a>
  <p class="msg tc">This link works once and expires in 30 minutes.</p>
  <p class="foot">Authorised staff only. Your activity is recorded.</p>
</div>
</x-dc>

</body>
</html>
