<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Scan page</title>
</head>
<body style="margin:0;background:#fff">
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,select{font-family:inherit}
a{text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #11111A; font-family: 'Lato', system-ui, sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 24px 22px 28px; overflow: hidden">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="Home.html" aria-label="Close scanner" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF">
      <svg aria-hidden="true" width="26" height="26" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M5 5l14 14M19 5 5 19"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700">Scan page 3</h1>
    <button aria-label="Toggle flash" style="width: 44px; height: 44px; background: none; border: 0; color: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="26" height="26" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M13 2 5 13.5h6L10 22l9-12h-6.5z"></path></svg>
    </button>
  </div>
  <div style="position: relative; margin-top: 16px; flex: 1; min-height: 0; background: #25253A; border-radius: 22px; overflow: hidden">
    <div style="position: absolute; left: 26px; right: 26px; top: 26px; bottom: 26px; background: #F0F0F7; border-radius: 6px; padding: 30px 28px; display: flex; flex-direction: column; gap: 14px" role="img" aria-label="Paper task card in the viewfinder">
      <div style="width: 45%; height: 14px; border-radius: 7px; background: #ABABC2"></div>
      <div style="width: 100%; height: 9px; border-radius: 5px; background: #CACADD"></div>
      <div style="width: 88%; height: 9px; border-radius: 5px; background: #CACADD"></div>
      <div style="width: 94%; height: 9px; border-radius: 5px; background: #CACADD"></div>
      <div style="width: 58%; height: 9px; border-radius: 5px; background: #CACADD"></div>
      <div style="width: 100%; height: 9px; border-radius: 5px; background: #CACADD"></div>
      <div style="width: 70%; height: 9px; border-radius: 5px; background: #CACADD"></div>
      <div style="width: 90%; height: 9px; border-radius: 5px; background: #CACADD"></div>
      <div style="width: 50%; height: 9px; border-radius: 5px; background: #CACADD"></div>
      <div style="width: 96%; height: 9px; border-radius: 5px; background: #CACADD"></div>
    </div>
    <div style="position: absolute; left: 14px; top: 14px; width: 40px; height: 40px; border-top: 4px solid #FFFFFF; border-left: 4px solid #FFFFFF"></div>
    <div style="position: absolute; right: 14px; top: 14px; width: 40px; height: 40px; border-top: 4px solid #FFFFFF; border-right: 4px solid #FFFFFF"></div>
    <div style="position: absolute; left: 14px; bottom: 14px; width: 40px; height: 40px; border-bottom: 4px solid #FFFFFF; border-left: 4px solid #FFFFFF"></div>
    <div style="position: absolute; right: 14px; bottom: 14px; width: 40px; height: 40px; border-bottom: 4px solid #FFFFFF; border-right: 4px solid #FFFFFF"></div>
    <div style="position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); background: #3F3F46; color: #FFFFFF; padding: 12px 20px; border-radius: 16px; font-size: 17px; line-height: 1.3; width: 150px">Page found. Hold steady.</div>
  </div>
  <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 22px; padding: 0 8px">
    <div style="position: relative; width: 56px; height: 66px; border-radius: 12px; background: #F0F0F7; border: 2px solid #FFFFFF" role="img" aria-label="2 pages scanned">
      <span style="position: absolute; right: -12px; top: -10px; min-width: 26px; height: 26px; box-sizing: border-box; border-radius: 13px; background: #1A66E8; color: #FFFFFF; font-size: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span>
    </div>
    <a href="SaveScan.html" aria-label="Capture page" style="width: 72px; height: 72px; border-radius: 36px; background: #FFFFFF; border: 5px solid #8C8CA8; box-sizing: border-box; display: block"></a>
    <a href="ScanReview.html" style="min-width: 64px; min-height: 44px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 20px; font-weight: 700">Done</a>
  </div>
</div>
</x-dc>



</body></html>
