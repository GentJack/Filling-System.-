<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Share</title>
</head>
<body style="margin:0;background:#fff">
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input,select{font-family:inherit}
a{text-decoration:none}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Lato', system-ui, sans-serif; color: #0B0B50; display: flex; flex-direction: column; padding: 24px 20px 24px; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 14px">
    <a href="Document.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0B0B50">
      <svg aria-hidden="true" width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5 8 12l7 7"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 32px; font-weight: 300">Share</h1>
  </div>
  <p style="margin: 6px 0 0 58px; font-size: 17px; color: #4B4B66">Task card 1042 · ZS-XXX · Rev 2</p>
  <div style="margin-top: 22px; display: flex; flex-direction: column; gap: 6px">
    <label for="guest" style="font-weight: 700; font-size: 16px">Guest email</label>
    <input id="guest" type="email" placeholder="name@company.com" style="width: 100%; height: 52px; box-sizing: border-box; border: 1.5px solid #E3E4F0; background: #F2F3FB; border-radius: 26px; padding: 0 20px; font-size: 17px; color: #0B0B50">
  </div>
  <div style="margin-top: 18px">
    <div style="font-weight: 700; font-size: 16px">Link expires after</div>
    <div role="group" aria-label="Link expiry" style="margin-top: 8px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; border: 1.5px solid #E3E4F0; border-radius: 28px">
      <button aria-pressed="false" style="height: 48px; border-radius: 24px; border: 0; background: transparent; color: #0B0B50; font-size: 16px; cursor: pointer">24 hours</button>
      <button aria-pressed="true" style="height: 48px; border-radius: 24px; border: 0; background: #0B0B50; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer">3 days</button>
      <button aria-pressed="false" style="height: 48px; border-radius: 24px; border: 0; background: transparent; color: #0B0B50; font-size: 16px; cursor: pointer">7 days</button>
    </div>
  </div>
  <div style="margin-top: 16px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 18px; background: #F2F3FB">
    <svg aria-hidden="true" width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0B0B50" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    <span style="font-size: 15px; line-height: 1.35">Guests can view only. They cannot download or print.</span>
  </div>
  <a href="ShareLinkCreated.html" style="margin-top: 22px; height: 58px; border-radius: 29px; background: #0B0B50; color: #FFFFFF; border: 0; font-size: 20px;display:flex;align-items:center;justify-content:center;">Create link</a>
  <p style="margin: 12px 0 0; font-size: 14px; color: #4B4B66; text-align: center">Every share is recorded in the activity log.</p>
  <h2 style="margin: 26px 0 0; font-size: 24px; font-weight: 300">Active links</h2>
  <div style="margin-top: 10px; border: 1.5px solid #E3E4F0; border-radius: 22px; overflow: hidden">
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px">
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 700">auditor@company.com</span><span style="font-size: 15px; color: #4B4B66">Expires in 2 days</span></span>
      <button style="min-height: 44px; padding: 0 6px; background: none; border: 0; color: #B3261E; font-size: 16px; font-weight: 700; cursor: pointer">Revoke</button>
    </div>
  </div>
</div>
</x-dc>



</body></html>
